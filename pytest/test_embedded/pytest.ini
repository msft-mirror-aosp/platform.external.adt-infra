[pytest]
norecursedirs = docs *.egg-info .git src js venv py2 py.tox
# Our fixtures are very expensive (i.e. booting emulator)
# and we do not want a timeout marker to include a possible emulator boot.
timeout_func_only = true
log_format = %(asctime)s {%(pathname)s:%(lineno)d} %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
log_level = INFO
log_file_level = INFO
log_file_format = %(asctime)s {%(pathname)s:%(lineno)d} %(levelname)s %(message)s
log_auto_indent = True

# Enable log cli if you want to see logs as you go (lots of logging!)
log_cli = False
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    e2e: marks test as end to end (deselect with '-m "not e2e"')
    perf: marks test as a performance test (deselect with '-m "not perf"')
    linux: marks test as linux only, will only run if you are on linux.
    darwin: marks test as darwin only, will only run if you are on darwin.
    win32: marks test as windows only, will only run on a windows machine.
testpaths =
    tests

