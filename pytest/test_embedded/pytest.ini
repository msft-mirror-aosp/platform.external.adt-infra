[pytest]
norecursedirs = docs *.egg-info .git src js venv py2 py.tox
# Our fixtures are very expensive (i.e. booting emulator)
# and we do not want a timeout marker to include a possible emulator boot.
log_format = %(asctime)s.%(msecs)03d %(name)-40s %(levelname)-7s %(message)s
log_date_format = %H:%M:%S
log_level = DEBUG
log_file_level = DEBUG
log_file_format = %(asctime)s.%(msecs)03d %(name)-40s %(levelname)-7s %(message)s
log_auto_indent = True
junit_logging = log
default_async_timeout = 60

# The number of times we want to retry if we detect a crash, if the emulator
# crashes we will run the test at most 3 times.
crash_retries = 2

# Enable log cli if you want to see logs as you go (lots of logging!)
log_cli = True

# Various test markers, generally you can would want to exclude lower priority
# tests when running higher priority tests.
markers =
    sanity: Emulator sanity tests. These are P0 tests, and should always succeed.
    fast: Emulator fast suite tests. These are P1 tests, and should always succeed.
    netsim: Verifies netsim functionality
    standard: Tests independent of an emulator
    adb: Exercises adb functionality
    android_tv: Runs on Android TV
    boot: Validates behavior immediately after boot
    console: Relates to the emulator console
    embedded: Runs only on an embedded emulator
    foldable: Operates on a foldable emulator
    newfoldable: Uses new foldable emulator API since 34
    graphics: Relates to graphics operations
    hardware: Low-level hardware test
    host_performance: Host-side performance test
    guest_performance: Guest-side performance test
    resizable: Runs on a resizable emulator
    newresizable: Uses new resizable emulator API since 34
    snapshot: Relates to snapshot operations
    multi_display: Relates to multi-display
    windows: Runs only on Windows
    chrome: Chrome tests
    netsim: Netsim emulator tests
    wear_os: Runs on Wear OS
    tablet: Runs on a tablet image
    embedded_new_resizable: New resizable embedded emulator API since 34
    wifi_performance: WiFi performance test
    ui_automator: Performs UI actions

testpaths =
    tests

