[pytest]
norecursedirs = docs *.egg-info .git src js venv py2 py.tox
log_format = %(asctime)s.%(msecs)03d %(name)-12s %(levelname)-7s %(message)s
log_date_format = %H:%M:%S
log_level = DEBUG
log_file_level = DEBUG
log_file_format = %(asctime)s.%(msecs)03d %(name)-12s %(levelname)-7s %(message)s
log_auto_indent = True
junit_logging = log
default_async_timeout = 60

# Enable log cli if you want to see logs as you go (lots of logging!)
#log_cli = True

# We are modifying the junit xml output
junit_family=xunit1

# Our timeout mechanism is not officially supported in pytest 8, but works
# fine, see https://github.com/pytest-dev/pytest/issues/12850
# We are also using the experimental API to add junit attributes
filterwarnings =
    ignore::pytest.PytestRemovedIn9Warning
    ignore::pytest.PytestExperimentalApiWarning

## addopts = --strict-markers
# Test markers are registered programmatically in tests/fixtures/markers.py

testpaths =
    tests

