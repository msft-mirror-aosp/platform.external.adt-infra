[build-system]
# AVOID CHANGING REQUIRES: IT WILL BE UPDATED BY PYSCAFFOLD!
requires = ["setuptools>=46.1.0", "wheel"]
build-backend = "setuptools.build_meta"

# [tool.setuptools_scm]
# # For smarter version schemes and other configuration options,
# # check out https://github.com/pypa/setuptools_scm
# version_scheme = "no-guess-dev"
[project]
name = "aemu-integration-test"
authors = [{ name = "Erwin Jansen", email = "jansene@google.com" }]
license = { file = "LICENSE.TXT" }
version = "0.0.1"
classifiers = ["Topic :: Software Development"]
dynamic = ["optional-dependencies"]

# Note here we pin the actual versions of the packages
dependencies = [
    "Jinja2==3.1.2",
    "MarkupSafe==2.1.1",
    "mobly==1.12.2",
    "mock==4.0.3",
    "Pillow==9.2.0",
    "PyAutoGUI==0.9.54",
    "protobuf==4.25.2",
    "grpcio==1.60.0",
    "pytest==7.1.3",
    "pytest-benchmark==3.4.1",
    "pytest-dependency==0.5.1",
    "alt-pytest-asyncio==0.7.2",
    "requests==2.28.1",
    "lxml==4.9.1",
    "iterators==0.2.0",
    "aiofiles==23.2.1",
    "importlib-metadata; python_version<'3.8'",
    "snippet-uiautomator==1.1.1",
    "deqr==0.2.2",
    # "pytest_crashretry @ file:///${AOSP_ROOT}/external/adt_infra/pytest/crash_retry",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
