plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.protobuf'
}

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId 'com.google.AnimateBox'
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName '1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            keyAlias = 'my_key_alias'
            keyPassword = 'my_key_password'
            storeFile = file('my_keystore.jks')
            storePassword = 'my_key_password'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    namespace 'com.google.emu'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.2.0'
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.google.android.mobly:mobly-snippet-lib:1.4.0'
    implementation 'androidx.test:monitor:1.6.1'

    testImplementation 'junit:junit:4.+'

    implementation 'javax.annotation:javax.annotation-api:1.2'
    implementation 'com.google.protobuf:protobuf-java:' + rootProject.protocVersion
    implementation 'com.google.protobuf:protobuf-java-util:' + rootProject.protocVersion

    implementation 'androidx.activity:activity-compose:1.8.1'
    implementation 'androidx.compose.foundation:foundation-android:1.5.4'
    implementation 'androidx.compose.material3:material3:1.1.2'
    implementation 'androidx.compose.ui:ui-tooling-android:1.5.4'
}

protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:' + rootProject.protocVersion }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                java  { }
            }
        }
    }
}
