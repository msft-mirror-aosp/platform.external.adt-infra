# content of: tox.ini , put in same dir as setup.py
[tox]
envlist = py3

[testenv]
install_command=python -m pip install -f http://localhost:3141/packages/staging  -i http://localhost:3141/packages/staging {opts} {packages}
# install pytest in the virtualenv where commands will be executed
deps = pytest
    pytest-timeout
    pytest-benchmark
    pytest-rerunfailures
    pytest-dependency
    jinja2
    emu-snap
    aemu-grpc
    sh

platform = linux|darwin
extras = tests
passenv = *
setenv = PY_IGNORE_IMPORTMISMATCH=1
suicide_timeout=1.0
interrupt_timeout=1.0
terminate_timeout=1.0

envlogdir = {toxworkdir}/log
commands =
    # NOTE: you can run any command line tool here - not just tests
    pytest -vv {posargs} -m "not perf" --junitxml={toxworkdir}/test_embedded_test.xml --timeout=600 --log-file={toxworkdir}/log/pytest.log

[pytest]
norecursedirs = docs *.egg-info .git src js venv py2 py.tox
# Our fixtures are very expensive (i.e. booting emulator)
# and we do not want a timeout marker to include a possible emulator boot.
timeout_func_only = true
log_format = %(asctime)s {%(pathname)s:%(lineno)d} %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
log_level = INFO
log_file_level = INFO
log_file_format = %(asctime)s {%(pathname)s:%(lineno)d} %(levelname)s %(message)s
log_auto_indent = True

# Enable log cli if you want to see logs as you go (lots of logging!)
log_cli = False
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    e2e: marks test as end to end (deselect with '-m "not e2e"')
    perf: marks test as a performance test (deselect with '-m "not perf"')
    linux: marks test as linux only, will only run if you are on linux.
    darwin: marks test as darwin only, will only run if you are on darwin.
    win32: marks test as windows only, will only run on a windows machine.
testpaths =
    tests
