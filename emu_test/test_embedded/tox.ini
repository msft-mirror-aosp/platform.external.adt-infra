# content of: tox.ini , put in same dir as setup.py
[tox]
# Add py3 as soon as the buildbots have support for python3.
envlist = py2

[testenv]
# install pytest in the virtualenv where commands will be executed
deps = pytest
    pytest-timeout
    py2: {toxworkdir}/wheels/aemu_grpc-0.0.1-py2-none-any.whl
    py2: {toxworkdir}/wheels/emu_snap-1.0-py2-none-any.whl
    py3: {toxworkdir}/wheels/aemu_grpc-0.0.1-py3-none-any.wheels
    pyr: {toxworkdir}/wheels/emu_snap-1.0-py3-none-any.whl
platform = linux|darwin
extras = tests
passenv = *
setenv = PY_IGNORE_IMPORTMISMATCH=1
commands =
    # NOTE: you can run any command line tool here - not just tests
    pytest {posargs} --junitxml={toxworkdir}/test_report.xml --timeout=600

[pytest]
norecursedirs = docs *.egg-info .git src js venv py2 py.tox
log_format = %(asctime)s  {%(pathname)s:%(lineno)d} %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
log_level = INFO
# Enable log cli if you want to see logs as you go (lots of logging!)
log_cli = True
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    e2e: marks test as end to end (deselect with '-m "not e2e"')
testpaths =
    tests